name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # A change to the schema of .frag files needs a migration for the files
      # written before it. On a pull request it also has to be newer than every
      # migration on the base branch.
      - name: Check migrations
        env:
          BASE: ${{ github.base_ref }}
        run: |
          if [ -n "$BASE" ]; then
            git fetch --depth=1 origin "+refs/heads/$BASE:refs/remotes/origin/$BASE"
            yarn workspace @thatopen/fragments migration:check --base "origin/$BASE"
          else
            yarn workspace @thatopen/fragments migration:check
          fi

      - name: Build library
        run: yarn build-core

      - name: Run tests
        run: yarn test
